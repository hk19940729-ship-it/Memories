<form method="post" th:object="${M0002}">
	<div>
	  <h3>取引先マスタ保守</h3>
	  <label class="inpulabel">取引先コード</label>
	  <input type="text" th:field="*{torCode}" class="inputx12">
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">取引先名</label>
	    <input type="text" th:field="*{torName}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">TEL</label>
	    <input type="text" th:field="*{tel}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">代表者名</label>
	    <input type="text" th:field="*{daihyoName}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">月</label>
	    <input type="text" th:field="*{yasumimon}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">火</label>
	    <input type="text" th:field="*{yasumitue}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">水</label>
	    <input type="text" th:field="*{yasumiwed}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">木</label>
	    <input type="text" th:field="*{yasumithu}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">金</label>
	    <input type="text" th:field="*{yasumifri}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">土</label>
	    <input type="text" th:field="*{yasumisat}" class="inputx12">
	  </div>
	</div>

	<div class="left1">
	  <div class="inputitem">
	    <label class="inpulabel">日</label>
	    <input type="text" th:field="*{yasumisun}" class="inputx12">
	  </div>
	</div>


  
  
  <div class="button1">
    <button type="submit" formaction="/M0002/Search">検索</button>
  </div>
  
  <hr>



  <div class="buttons">

    <div class="button2">
      <button type="submit" formaction="/M0002/Save">登録</button>
    </div>
    <div class="button3">
      <button type="submit" formaction="/M0002/Delete">削除</button>
    </div>
  </div>
</form>
